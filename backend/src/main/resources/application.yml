micronaut:
  application:
    name: car-rental-system

  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        web:
          allowedOrigins:
            - http://localhost:5173
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          allowedHeaders:
            - Content-Type
            - Authorization

logging:
  level:
    com.carrental: DEBUG
    io.micronaut: INFO

datasources:
  default:
    url: jdbc:h2:mem:devDb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    schema-generate: NONE

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop